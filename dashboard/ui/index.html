<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 stops iOS Safari's own auto-zoom-on-input-focus
         (it still allows pinch-to-zoom despite the name — Apple's WebKit
         only disables that with user-scalable=no, which we do NOT set). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Chief Dashboard</title>
    <!-- PWA (phase 2a): installable "AgentBar" home-screen app for the phone
         Needs You inbox. manifest.webmanifest + icons live in ui/public/
         (copied verbatim to dist/ root by Vite) and are served by
         chief-dashboard-server.py's Handler.PWA_PUBLIC_PATHS — including,
         on the remote (Tailscale) listener, WITHOUT the login cookie, since
         iOS fetches these before a page's own fetch/cookie jar is involved
         in some install flows. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0f14" />
    <!-- Geist Mono: terminal output, commands/diffs, ids and counts (--mono
         in src/index.css). Text stays Avenir (system font, no download). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgentBar" />
    <script>
      // Mirrors Mantine's own attribute logic (used once React mounts) so the
      // page never flashes light-then-dark on a system that's already dark —
      // this runs before any CSS or React, synchronously, off the same
      // media query MantineProvider's defaultColorScheme="auto" listens on.
      (function () {
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
