name: FastTabMobile
options:
  bundleIdPrefix: app.theindie
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  FastTabPackage:
    path: ..
  # Shared L1 library (sibling repo ~/01_Project/IndieLibKit). IndieLinks = site
  # detection + link-card metadata for X / YouTube / Reddit / GitHub.
  IndieLibKit:
    path: ../../IndieLibKit
  # On-device English Read Aloud voice (Paradee, FastTabMobile/Reader/ReadAloud/Paradee/): runs
  # the bundled paradee_int8.onnx. Pinned: a new ORT can change the binary size a lot.
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

targets:
  FastTabMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabMobile
        excludes:
          # Paradee G2P data-rebuild scripts: dev-only, not app resources.
          - "**/G2PData/tools/**"
      # Widget snapshot model + deep links, compiled into both the app and FastTabWidgets.
      - path: Shared/Widgets
      # AppMode (reader only vs Mac companion), also read by the share extension.
      - path: Shared/AppMode
    dependencies:
      - target: FastTabShare
        embed: true
        codeSign: true
      - target: FastTabWidgets
        embed: true
        codeSign: true
      - package: FastTabPackage
        product: FastTabSync
      # Onboarding hero clock, easing and stage, shared with the Mac onboarding.
      - package: IndieLibKit
        product: IndieMotion
      - package: IndieLibKit
        product: IndieLinks
      # Generic metric events + time bucketing for the More tab's Statistics (FastTabMobile/Stats/).
      - package: IndieLibKit
        product: IndieMetrics
      # Portfolio account (theindie, Sign in with Apple: FastTabMobile/Account/) — YouTube
      # transcripts need it. Sharing (FastTabMobile/Sharing/) is not wired at launch yet.
      - package: IndieLibKit
        product: IndieAccount
      # Tag paths, tag filter (AND + descendants) and tag search for the Highlights feed,
      # plus text folding for its search. See FastTabMobile/Reader/HighlightFeedModel.swift.
      - package: IndieLibKit
        product: IndieTags
      - package: IndieLibKit
        product: IndieSearch
      # Anchored comment threads on highlights (FastTabMobile/Reader/ReaderCommentThreads.swift),
      # MDLY's model and file format.
      - package: IndieLibKit
        product: IndieComments
      - package: IndieLibKit
        product: IndieShareSync
      # YouTube transcripts in the reader (FastTabMobile/Reader/YouTube/) + the power-up gate.
      - package: IndieLibKit
        product: IndieTranscripts
      - package: IndieLibKit
        product: IndiePowerUps
      # Natural Voice subscription (FastTabMobile/NaturalVoiceSubscription/): Parklet's StoreKit engine
      # with FastTab's plan (`PlusPlan.fastTabNaturalVoice`).
      - package: IndieLibKit
        product: IndieStore
      # On-device transcript clean-up (FastTabMobile/Reader/YouTube/TranscriptCleanup*.swift).
      - package: IndieLibKit
        product: IndieTextCleanup
      # Paradee voice inference (FastTabMobile/Reader/ReadAloud/Paradee/ParadeeModel.swift).
      - package: OnnxRuntime
        product: onnxruntime
    postBuildScripts:
      # onnxruntime ships a STATIC library in a framework wrapper, already linked into the
      # app binary. Xcode still copies a stub onnxruntime.framework into Frameworks/ (ignores
      # `embed: false`); its minos (17.0) != its Info.plist (15.1), so App Store upload fails
      # with 90208. Nothing loads the stub (otool -L), so drop it before the app is signed.
      - name: Remove onnxruntime stub framework
        basedOnDependencyAnalysis: false
        # Declared input = the copied stub, so this runs AFTER Xcode embeds it.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework
        script: |
          stub="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          if [ -d "${stub}" ]; then rm -r "${stub}"; fi
          rmdir "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}" 2>/dev/null || true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobile
        # iPhone only: no iPad layout yet, and iPad would need its own 13" App Store screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 56S46Y7CKN
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FastTabMobile/FastTabMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: YES
        # Home-screen + App Store name. Widgets keep "FastTab" (below).
        INFOPLIST_KEY_CFBundleDisplayName: FastTab Reader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Export compliance: HTTPS and Apple's CloudKit encryption only (exempt).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # No OTHER_CODE_SIGN_FLAGS "--deep -i <app id>": it re-signs embedded frameworks
        # (onnxruntime.framework) with the app's identifier and the iPhone refuses the install.
      configs:
        Release:
          # App Store demo library (AppStoreDemo/, Debug only): keep its thumbnails out of Release.
          EXCLUDED_SOURCE_FILE_NAMES: "demo-thumb-*"
    # A real plist, not an `INFOPLIST_KEY_...` setting: there is no such setting
    # for UIBackgroundModes, and Xcode drops unrecognised INFOPLIST_KEY_* keys
    # without a word. `GENERATE_INFOPLIST_FILE` stays on above — Xcode merges
    # the generated keys into this file rather than replacing it.
    info:
      path: FastTabMobile/Info.plist
      properties:
        # Lets a CloudKit silent push wake the app while it is off screen.
        # Without it a push only lands when the app is already running.
        UIBackgroundModes:
          - audio
          - remote-notification
        # `fasttab://` deep links from the home-screen widgets (Shared/Widgets/WidgetDeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: app.theindie.FastTabMobile
            CFBundleURLSchemes:
              - fasttab
    entitlements:
      path: FastTabMobile/FastTabMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-environment: Development
        # Must match `icloud-container-environment` above: a Development
        # container pushes over sandbox APNs, and a mismatch delivers nothing
        # with no error anywhere. Flip both together when moving to Production.
        aps-environment: development
        com.apple.security.application-groups:
          - group.app.theindie.FastTab
        # theindie account sign-in (FastTabMobile/Account/). Needs the capability on the
        # app id in the Apple Developer portal.
        com.apple.developer.applesignin:
          - Default

  FastTabShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabShare
      - path: Shared/AppMode
    dependencies:
      - package: FastTabPackage
        product: FastTabSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobile.Share
      TARGETED_DEVICE_FAMILY: "1"
      DEVELOPMENT_TEAM: 56S46Y7CKN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: FastTabShare/FastTabShare.entitlements
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 8
      INFOPLIST_FILE: FastTabShare/Info.plist
      SWIFT_VERSION: "5.9"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: FastTabShare/FastTabShare.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Development
        com.apple.security.application-groups:
          - group.app.theindie.FastTab

  # Home-screen widgets (tap-to-open only). Reads the snapshot the app writes to the app group.
  FastTabWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabWidgets
      - path: Shared/Widgets
      # AppMode: reader-only phones get a "needs your Mac" Open Tabs widget.
      - path: Shared/AppMode
    dependencies:
      - package: FastTabPackage
        product: FastTabSync
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobile.Widgets
      TARGETED_DEVICE_FAMILY: "1"
      DEVELOPMENT_TEAM: 56S46Y7CKN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: FastTabWidgets/FastTabWidgets.entitlements
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 8
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: FastTab
      SWIFT_VERSION: "5.9"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: FastTabWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FastTabWidgets/FastTabWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.theindie.FastTab

  FastTabMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabMobileTests
      # Fake account server, in-memory keychain and share fixtures from IndieLibKit, compiled
      # in rather than linked: linking a second product that depends on IndieAccount makes
      # Xcode turn IndieAccount into an embedded framework (same as Parklet's project.yml).
      - path: ../../IndieLibKit/Sources/IndieAccountTestSupport
      - path: ../../IndieLibKit/Sources/IndieShareSyncTestSupport
      # Local App Store catalog for StoreKitTest purchases (NaturalVoiceStoreKitTests).
      - path: Config/FastTab.storekit
        buildPhase: resources
    dependencies:
      - target: FastTabMobile
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobileTests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"

schemes:
  FastTabMobile:
    build:
      targets:
        FastTabMobile: all
        FastTabShare: all
        FastTabWidgets: all
        FastTabMobileTests: [test]
    # Local test purchases in the simulator (Natural Voice monthly/yearly, 7-day trial).
    run:
      storeKitConfiguration: Config/FastTab.storekit
    test:
      targets:
        - FastTabMobileTests
