name: FastTabMobile
options:
  bundleIdPrefix: app.theindie
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  FastTabPackage:
    path: ..
  # Shared L1 library (sibling repo ~/01_Project/IndieLibKit). IndieLinks = site
  # detection + link-card metadata for X / YouTube / Reddit / GitHub.
  IndieLibKit:
    path: ../../IndieLibKit

targets:
  FastTabMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabMobile
    dependencies:
      - target: FastTabShare
        embed: true
        codeSign: true
      - package: FastTabPackage
        product: FastTabSync
      - package: IndieLibKit
        product: IndieLinks
      # Generic metric events + time bucketing for the More tab's Statistics (FastTabMobile/Stats/).
      - package: IndieLibKit
        product: IndieMetrics
      # Portfolio account + sharing (L1 move P5 proof). Linked, but nothing at launch uses
      # them yet: theindie-api does not list the "fasttab" app. See FastTabMobile/Sharing/.
      - package: IndieLibKit
        product: IndieAccount
      - package: IndieLibKit
        product: IndieShareSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobile
      DEVELOPMENT_TEAM: 56S46Y7CKN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: FastTabMobile/FastTabMobile.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: FastTab
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      SWIFT_VERSION: "5.9"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      OTHER_CODE_SIGN_FLAGS: "--deep -i app.theindie.FastTabMobile"
    # A real plist, not an `INFOPLIST_KEY_...` setting: there is no such setting
    # for UIBackgroundModes, and Xcode drops unrecognised INFOPLIST_KEY_* keys
    # without a word. `GENERATE_INFOPLIST_FILE` stays on above — Xcode merges
    # the generated keys into this file rather than replacing it.
    info:
      path: FastTabMobile/Info.plist
      properties:
        # Lets a CloudKit silent push wake the app while it is off screen.
        # Without it a push only lands when the app is already running.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: FastTabMobile/FastTabMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-container-development-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-services:
          - CloudKit
          - KeyValueStorage
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-environment: Development
        # Must match `icloud-container-environment` above: a Development
        # container pushes over sandbox APNs, and a mismatch delivers nothing
        # with no error anywhere. Flip both together when moving to Production.
        aps-environment: development
        com.apple.security.application-groups:
          - group.app.theindie.FastTab

  FastTabShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabShare
    dependencies:
      - package: FastTabPackage
        product: FastTabSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobile.Share
      DEVELOPMENT_TEAM: 56S46Y7CKN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: FastTabShare/FastTabShare.entitlements
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      INFOPLIST_FILE: FastTabShare/Info.plist
      SWIFT_VERSION: "5.9"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: FastTabShare/FastTabShare.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-container-development-container-identifiers:
          - iCloud.app.theindie.FastTab
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Development
        com.apple.security.application-groups:
          - group.app.theindie.FastTab

  FastTabMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FastTabMobileTests
      # Fake account server, in-memory keychain and share fixtures from IndieLibKit, compiled
      # in rather than linked: linking a second product that depends on IndieAccount makes
      # Xcode turn IndieAccount into an embedded framework (same as Parklet's project.yml).
      - path: ../../IndieLibKit/Sources/IndieAccountTestSupport
      - path: ../../IndieLibKit/Sources/IndieShareSyncTestSupport
    dependencies:
      - target: FastTabMobile
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.theindie.FastTabMobileTests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"

